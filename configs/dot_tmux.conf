# Ctrl+B remains the prefix. Sessions start only when requested.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB'
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g status-style 'bg=#1a1b26,fg=#c0caf5'
set -g status-left '#[fg=#7aa2f7,bold] #S #[default]'
set -g status-left-length 32
set -g status-right '#[fg=#565f89]%H:%M '
setw -g window-status-current-style 'fg=#1a1b26,bg=#7aa2f7,bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '
set -g pane-border-style 'fg=#292e42'
set -g pane-active-border-style 'fg=#7aa2f7'
bind c new-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
